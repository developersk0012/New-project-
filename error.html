<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Error Check</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav><b>Telegram Quiz Publisher</b><a href="index.html">Home</a><a href="seema.html">Quiz Panel</a></nav>
<main class="wrap">
  <h1>JSON Error Check</h1>
  <div id="result"></div>
  <div class="card">
    <h2>Dobara check karein</h2>
    <input type="file" id="file" accept=".json,application/json" aria-label="JSON file chunein">
    <p class="hint">Fix ki hui file yahan upload karke turant check kar sakte hain.</p>
  </div>
  <p><a class="btn" href="seema.html">Quiz Panel par wapas jayein</a></p>
</main>
<script src="assets/validator.js"></script>
<script>
var box = document.getElementById("result");

function show(name, res) {
  box.innerHTML = "";
  var d = document.createElement("div");
  if (res.ok) {
    d.className = "msg ok";
    d.textContent = (name ? name + ": " : "") + "Koi error nahi mila. " + res.questions.length + " questions sahi hain.";
  } else {
    d.className = "msg bad";
    var h = document.createElement("strong");
    h.textContent = (name ? name + ": " : "") + res.errors.length + " error mile";
    var ul = document.createElement("ul"); ul.className = "errs";
    res.errors.forEach(function (e) { var li = document.createElement("li"); li.textContent = e; ul.appendChild(li); });
    d.appendChild(h); d.appendChild(ul);
  }
  box.appendChild(d);
}

try {
  var saved = JSON.parse(sessionStorage.getItem("tqp_errors") || "null");
  if (saved) show(saved.file, { ok: false, errors: saved.errors });
  else box.innerHTML = '<div class="msg">Abhi koi error save nahi hai. Neeche se file upload karke check karein.</div>';
} catch (e) {}

document.getElementById("file").addEventListener("change", function (ev) {
  var f = ev.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () { show(f.name, QuizValidator.validate(r.result)); };
  r.readAsText(f, "utf-8");
});
</script>
</body>
</html>
