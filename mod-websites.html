<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mod Websites - SK Education</title><meta name="theme-color" content="#0B0E15"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://educationqpp-default-rtdb.firebaseio.com" crossorigin><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><script src="tg.js"></script><script src="data.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script defer src="config.js"></script><script defer src="nav.js"></script></head>
<body><div class="app"><header class="topbar"><div class="brand"><img src="icons/logo-96.png" width="30" height="30" alt="SK"><span>Mod Websites</span></div><button class="icon-btn" onclick="nav('index.html')">←</button></header><main class="content"><input class="search" id="search" type="search" placeholder="Search..." autocomplete="off"><div class="mod-grid" id="list"><div class="skel" style="height:230px"></div><div class="skel" style="height:230px"></div></div></main><nav class="bottom-nav"><button class="nav-item" onclick="nav('index.html')"><span>⌂</span>HOME</button><button class="nav-item" onclick="nav('my-courses.html')"><span>▣</span>MY COURSES</button><button type="button" class="nav-item" onclick="nav('test-series.html')"><span>✎</span>TEST SERIES</button><button class="nav-item" onclick="nav('chat.html')"><span>💬</span>CHAT</button><button class="nav-item" onclick="nav('profile.html')"><span>●</span>PROFILE</button></nav></div><div id="toast"></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
if(!requireApp())return;
idle(watchBlocked,2000);
const list=document.getElementById("list");let items=null,t=null;
function card(x){
  const lg=safeUrl(x.logo)||APP_LOGO,host=hostOf(safeUrl(x.url));
  return `<article class="mcard"><div class="mhead"><div class="mlogo"><img src="${esc(lg)}" loading="lazy" decoding="async" alt="" onerror="this.onerror=null;this.src='${APP_LOGO}';this.classList.add('fb')"></div><div class="mtitle"><h3>${esc(x.name)}</h3><small>${esc(host)}</small></div></div>
  ${x.about?`<p class="mabout">${esc(x.about)}</p>${x.about.length>110?'<button type="button" class="mmore">Read more</button>':""}`:""}
  <a class="mbtn" href="site-view.html?id=${encodeURIComponent(x.id)}">${icon("globe",18)} View Website</a></article>`;
}
function render(){
  if(!items)return;
  const q=document.getElementById("search").value.trim().toLowerCase();
  const r=items.filter(x=>(x.name+" "+(x.about||"")).toLowerCase().includes(q));
  list.innerHTML=r.length?r.map(card).join(""):'<div style="grid-column:1/-1">'+stateHtml(items.length?"Nothing found":"No websites yet",items.length?"Try a different search.":"New Mod Websites are coming soon.")+'</div>';
}
list.addEventListener("click",e=>{const b=e.target.closest(".mmore");if(!b)return;const p=b.previousElementSibling;p.classList.toggle("open");b.textContent=p.classList.contains("open")?"Show less":"Read more"});
document.getElementById("search").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(render,120)});
SKData.modSites(d=>{items=d;render()}).then(d=>{items=d;render()}).catch(()=>{list.innerHTML='<div style="grid-column:1/-1">'+stateHtml("Could not load","Check your internet connection.",retryBtn())+'</div>'});
});
</script></body></html>
