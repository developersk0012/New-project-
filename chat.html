<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat - SK Education</title><meta name="theme-color" content="#0B0E15"><meta name="description" content="SK Education - free study material, courses and support chat."><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://educationqpp-default-rtdb.firebaseio.com" crossorigin><link rel="preconnect" href="https://testing-5ce76-default-rtdb.firebaseio.com" crossorigin><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><script src="tg.js"></script><script src="data.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script defer src="config.js"></script><script defer src="nav.js"></script><style>
.replybar{display:none;padding:8px 14px;background:var(--surface2);border-top:1px solid var(--line);font-size:12px;align-items:center;gap:8px}
.replybar.show{display:flex}.replybar .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.replybar button,.photo-pending button{border:0;background:none;color:var(--muted);cursor:pointer;display:flex}
.chat-bubble .reply{font-size:10.5px;opacity:.75;border-left:3px solid currentColor;padding-left:7px;margin-bottom:5px}
.photo{max-width:230px;max-height:260px;border-radius:10px;display:block;margin-bottom:5px}
.photo-pending{display:none;padding:8px 14px;background:var(--surface2);border-top:1px solid var(--line);font-size:12px;color:var(--muted);align-items:center;justify-content:space-between}
.photo-pending.show{display:flex}
</style></head>
<body><div class="app"><header class="topbar"><div class="brand"><img src="icons/logo-96.png" width="30" height="30" alt="SK" onerror="this.onerror=null;this.src='icons/icon-192.png'"><div><span>SK Education</span><small style="display:block;color:var(--muted);font-size:11px;font-weight:500" id="presence">Admin support</small></div></div><button type="button" class="icon-btn" onclick="nav('index.html')">←</button></header>
<div class="chat-page"><div class="messages" id="messages"><div class="skel-list" style="padding:12px"><div class="skel" style="min-height:44px;width:60%"></div><div class="skel" style="min-height:44px;width:45%;margin-left:auto"></div><div class="skel" style="min-height:44px;width:55%"></div></div></div><div class="replybar" id="replybar"><span id="replyIco"></span><span class="rt" id="replytext"></span><button type="button" onclick="cancelReply()" aria-label="Cancel reply" id="replyX"></button></div><div class="photo-pending" id="photoPending"><span>Photo selected — tap the send button</span><button type="button" onclick="cancelPhoto()" aria-label="Remove photo" id="photoX"></button></div><div class="chat-compose"><button type="button" class="icon-btn" id="photoBtn" aria-label="Attach photo"></button><input id="photo" type="file" accept="image/*" hidden><input id="text" type="text" placeholder="Type a message..." autocomplete="off"><button type="button" class="primary" id="send" aria-label="Send"></button></div></div>
<nav class="bottom-nav"><button type="button" class="nav-item" onclick="nav('index.html')"><span>⌂</span>HOME</button><button type="button" class="nav-item" onclick="nav('my-courses.html')"><span>▣</span>MY COURSES</button><button type="button" class="nav-item" onclick="nav('test-series.html')"><span>✎</span>TEST SERIES</button><button type="button" class="nav-item active"><span>💬</span>CHAT</button><button type="button" class="nav-item" onclick="nav('profile.html')"><span>●</span>PROFILE</button></nav></div>
<div class="sheet-back" id="sheetBack"><div class="sheet" role="menu"><div class="sheet-preview" id="sheetPreview"></div><button type="button" data-a="reply"></button><button type="button" data-a="copy"></button><button type="button" data-a="del" class="del"></button></div></div>
<div id="toast"></div>
<script>
document.addEventListener("DOMContentLoaded",function(){

if(requireApp()){
 idle(function(){watchBlocked();registerUser().catch(()=>{})},1500);
 const uid=getUserId(),ref=db.ref("chats/"+uid),msgs=document.getElementById("messages"),$=id=>document.getElementById(id);
 let reply=null,typingTimer=null,pendingPhoto=null,cache={},lastData={};
 $("replyIco").innerHTML=icon("reply",15);$("replyX").innerHTML=icon("x",15);$("photoX").innerHTML=icon("x",15);
 $("photoBtn").innerHTML=icon("camera",18);$("send").innerHTML=icon("send",17);
 document.querySelector('[data-a=reply]').innerHTML=icon("reply",18)+"Reply";
 document.querySelector('[data-a=copy]').innerHTML=icon("copy",18)+"Copy";
 document.querySelector('[data-a=del]').innerHTML=icon("trash",18)+"Delete";

 const time=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
 const dateLabel=t=>{const d=new Date(t),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);if(d.toDateString()===n.toDateString())return "Today";if(d.toDateString()===y.toDateString())return "Yesterday";return d.toLocaleDateString([],{day:"numeric",month:"short"})};
 function render(data,adminReadUntil){
   cache=data||{};
   const box=msgs,near=box.scrollHeight-box.scrollTop-box.clientHeight<140||box.querySelector(".empty");
   const arr=Object.entries(cache).sort((a,b)=>String(a[1].timestamp).localeCompare(String(b[1].timestamp)));
   let lastDate=null,html="";
   arr.forEach(([k,m])=>{
     const dl=dateLabel(m.timestamp);if(dl!==lastDate){html+=`<div class="date-sep">${dl}</div>`;lastDate=dl}
     const mine=m.sender==="user",seen=mine&&(m.user_read||(adminReadUntil&&adminReadUntil>=m.timestamp));
     html+=`<div class="bubble chat-bubble ${mine?"me":""}" data-key="${esc(k)}">${m.reply_to?`<div class="reply">${esc(m.reply_to.text||"")}</div>`:""}${m.link_url&&isImageUrl(m.link_url)?`<img class="photo" src="${esc(m.link_url)}" loading="lazy" decoding="async" alt="">`:""}<div>${esc(m.text||"")}</div>${m.link_url&&!isImageUrl(m.link_url)?`<a href="${esc(m.link_url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;font-size:11px">${esc(m.link_title||"Open link")}</a>`:""}<small>${time(m.timestamp)}${mine?(seen?" ✓✓":" ✓"):""}</small></div>`;
   });
   msgs.innerHTML=arr.length?html:'<div class="empty">Start a chat with the admin 👋</div>';
   if(near)msgs.scrollTop=msgs.scrollHeight;
 }

 /* one listener for messages + presence + read receipts */
 ref.on("value",s=>{
   const d=s.val()||{};lastData=d;
   render(d.messages,d.admin_read_until);
   const typing=d.admin_typing&&(Date.now()-new Date(d.admin_typing).getTime()<4000);
   $("presence").innerHTML=typing?'<span class="typing-dots"><span></span><span></span><span></span></span> typing...':d.online?"Admin online":"Admin support";
   // mark admin messages as read (guarded, otherwise our own write would loop)
   if(d.last_sender==="admin"&&d.last_timestamp&&(!d.user_read_until||d.user_read_until<d.last_timestamp)){
     ref.update({user_read_until:new Date(Math.max(Date.now(),Date.parse(d.last_timestamp))).toISOString()}).catch(()=>{});
   }
 });
 ref.update({user_name:getUserName(),online:true,last_seen:new Date().toISOString()});
 ref.onDisconnect().update({online:false,last_seen:new Date().toISOString()});

 /* tap a message -> action sheet */
 let sel=null;
 msgs.addEventListener("click",e=>{
   const b=e.target.closest(".bubble");if(!b)return;
   const k=b.dataset.key,m=cache[k];if(!m)return;
   sel={key:k,m};
   $("sheetPreview").textContent=m.text||"Photo";
   document.querySelector('[data-a=del]').style.display=m.sender==="user"?"flex":"none";
   $("sheetBack").classList.add("open");
 });
 $("sheetBack").addEventListener("click",async e=>{
   const a=e.target.closest("button[data-a]");
   if(!a){if(e.target===$("sheetBack"))$("sheetBack").classList.remove("open");return}
   $("sheetBack").classList.remove("open");if(!sel)return;
   const {key,m}=sel;
   if(a.dataset.a==="reply"){reply={text:m.text||"Photo"};$("replytext").textContent=reply.text;$("replybar").classList.add("show");$("text").focus()}
   else if(a.dataset.a==="copy"){try{await navigator.clipboard.writeText(m.text||"");toast("Copied")}catch(err){toast("Copy failed","error")}}
   else if(a.dataset.a==="del"){
     if(!await askConfirm("Delete this message?","It will be removed for the admin too."))return;
     try{await ref.child("messages/"+key).remove();await refreshChatMeta(ref);toast("Message deleted")}catch(err){toast("Delete failed","error")}
   }
 });
 window.cancelReply=()=>{reply=null;$("replybar").classList.remove("show")};
 window.cancelPhoto=()=>{pendingPhoto=null;$("photo").value="";$("photoPending").classList.remove("show")};

 $("text").addEventListener("input",()=>{
   ref.update({user_typing:new Date().toISOString()});clearTimeout(typingTimer);typingTimer=setTimeout(()=>ref.update({user_typing:null}),2500)
 });
 async function uploadPhoto(file){const r=await fetch("/api/upload-image",{method:"POST",headers:{"Content-Type":file.type||"application/octet-stream"},body:file});const raw=await r.text();let j;try{j=JSON.parse(raw)}catch(e){throw new Error("Image upload response invalid")};if(!r.ok||!j.ok||!j.url)throw new Error(j.error||"Image upload failed");return j.url}
 async function send(){
   const input=$("text"),text=input.value.trim();if(!text&&!pendingPhoto)return;
   const button=$("send");button.disabled=true;
   try{
     const ts=new Date().toISOString();
     let data={sender:"user",text:text||"📷 Photo",timestamp:ts,user_read:false};
     if(pendingPhoto){data.link_title="Photo";data.link_url=await uploadPhoto(pendingPhoto);cancelPhoto()}
     if(reply){data.reply_to={sender:"admin",text:reply.text};cancelReply()}
     await ref.child("messages").push(data);
     await ref.update({user_name:getUserName(),last_message:data.text,last_sender:"user",last_timestamp:ts,user_typing:null});
     input.value="";
     notifyTelegram("message",{userName:getUserName(),messageText:data.text}).catch(()=>{});
   }catch(e){console.error("Chat send failed:",e);toast("Message send failed","error")}
   finally{button.disabled=false}
 }
 $("send").onclick=send;
 $("text").onkeydown=e=>{if(e.key==="Enter")send()};
 $("photoBtn").onclick=()=>$("photo").click();
 $("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")){toast("Please select an image file","error");e.target.value="";return}if(f.size>10*1024*1024){toast("Photo must be smaller than 10 MB","error");e.target.value="";return}pendingPhoto=f;$("photoPending").classList.add("show")};
 window.addEventListener("beforeunload",()=>ref.update({online:false,last_seen:new Date().toISOString()}));
}

});
</script></body></html>
