<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Courses - SK Education</title><meta name="theme-color" content="#0B0E15"><meta name="description" content="SK Education - free study material, courses and support chat."><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="preconnect" href="https://educationqpp-default-rtdb.firebaseio.com" crossorigin><link rel="preconnect" href="https://testing-5ce76-default-rtdb.firebaseio.com" crossorigin><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><script src="tg.js"></script><script src="data.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script defer src="config.js"></script><script defer src="nav.js"></script></head>
<body><div class="app"><header class="topbar"><div class="brand"><img src="icons/logo-96.png" width="30" height="30" alt="SK" onerror="this.onerror=null;this.src='icons/icon-192.png'"><span>My Courses</span></div><button class="icon-btn" onclick="nav('index.html')">←</button></header><main class="content"><div class="section-head" style="margin-top:2px"><h2>My Courses</h2><a href="courses.html">All courses →</a></div><div class="cgrid" id="list"><div class="skel" style="height:230px"></div><div class="skel" style="height:230px"></div></div></main><nav class="bottom-nav"><button class="nav-item" onclick="nav('index.html')"><span>⌂</span>HOME</button><button class="nav-item active"><span>▣</span>MY COURSES</button><button type="button" class="nav-item" onclick="nav('test-series.html')"><span>✎</span>TEST SERIES</button><button class="nav-item" onclick="nav('chat.html')"><span>💬</span>CHAT</button><button class="nav-item" onclick="nav('profile.html')"><span>●</span>PROFILE</button></nav></div><div id="toast"></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
if(!requireApp())return;
idle(watchBlocked,2000);
const list=document.getElementById("list"),cat=getCategory()||"10";
let batches=null,enr=null;
function render(){
  if(!enr)return;
  const entries=Object.values(enr).filter(x=>(x.category||"10")===cat);
  list.innerHTML=entries.length?entries.map((x,i)=>{const id=x.batchId,b=Object.assign({},x,(batches&&batches[id])||{});return courseCard(id,b,true,i)}).join(""):'<div style="grid-column:1/-1">'+stateHtml("You have not enrolled in any course yet","Choose your first course.",'<br><a class="primary" href="courses.html" style="display:inline-block;width:auto;padding:10px 20px">Browse Courses</a>')+'</div>';
}
loadThumbs(render);
loadBatches(b=>{batches=b;render()}).then(b=>{batches=b;render()}).catch(()=>{});
loadEnrollments(v=>{enr=v;render()}).catch(()=>{if(!enr)list.innerHTML='<div style="grid-column:1/-1">'+stateHtml("Could not load","Check your internet connection.",retryBtn())+'</div>'});

});
</script></body></html>
